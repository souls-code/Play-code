<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Todo List</h1>
            <p class="subtitle">Organize your day efficiently</p>
        </header>

        <div class="input-section">
            <form id="todo-form">
                <input 
                    type="text" 
                    id="todo-input" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                    required
                >
                <button type="submit" id="add-btn">
                    <span>Add</span>
                </button>
            </form>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="stats">
            <span id="total-tasks">0 task(s)</span>
            <span id="completed-tasks">0 completed</span>
        </div>

        <ul id="todo-list" class="todo-list">
            <!-- Tasks will be added here dynamically -->
        </ul>

        <div id="empty-state" class="empty-state">
            <span class="empty-icon">🎯</span>
            <p>No tasks yet</p>
            <p class="empty-hint">Add your first task above</p>
        </div>

        <footer>
            <button id="clear-completed" class="clear-btn" style="display: none;">
                Clear completed tasks
            </button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
